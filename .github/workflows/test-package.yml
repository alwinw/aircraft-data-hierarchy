name: Test Package

on:
  push:
    branches:
      - "*" # Trigger on push to any branch
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install the project
        run: |
          uv sync --locked --all-extras --group test

      - name: Run tests
        run: |
          uv run pytest
