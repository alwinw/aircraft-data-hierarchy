[project]
name = "adh"
version = "0.2.0"
description = "The Aircraft Data Hierarchy (ADH) is a modern data definition standard for the aerospace vehicle design studies. The ADH enables engineers to exchange information (i.e. geometry, disciplinary tool inputs/outputs, requirements, etc.) between tools using a common data structure and a schema that can be validated."
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Ranald M Engelbeck", email = "ranald.m.engelbeck@boeing.com" },
  { name = "Eduardo Ocampo" },
]
maintainers = [
  { name = "Alwin Wang" },
]
requires-python = ">=3.9"
keywords = [
  "ADH",
  "MBSA&E",
  "aerospace data exchange",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
  "Typing :: Typed",
]
dependencies = [
  "pint>=0.24",
  "pydantic>=2.12",
  "pydantic-pint>=0.3",
]

[project.optional-dependencies]
diagrams = [
  "graphviz>=0.21",
  "tabulate>=0.9",
  "IPython>=8.18",
]

[project.urls]
Repository = "https://github.com/alwinw/aircraft-data-hierarchy"
Documentation = "https://alwinw.github.io/aircraft-data-hierarchy/"
Releases = "https://github.com/alwinw/aircraft-data-hierarchy/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
  "griffe-pydantic>=1.1; python_version < '3.10'",
  "griffe-pydantic>=1.3; python_version >= '3.10'",
  "mkdocs-gen-files>=0.5",
  "mkdocs>=1.6",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-material>=9.7",
  "mkdocs-section-index>=0.3",
  "mkdocstrings[python]>=0.30",
]
interactive = [
  "ipykernel>=6.31",
]
lint = [
  "pyright[nodejs]>=1.1",
  "ruff>=0.15",
  "ty>=0.0.15",
]
test = [
  "coverage>=7.10",
  "pytest>=8.4",
  "pytest-cov>=7.0",
]

[tool.creosote]
exclude-deps = [
  "pydantic-pint",  # reimplemented locally in adh.geom.units; listed as attribution
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = false
changelog_incremental = true
use_shortcuts = true

[tool.pyright]
include = [
  "src",
  # "tests",
]
reportMissingImports = "none"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = [
  "-v",                       # Increase verbosity
  "-ra",                      # Extra test summary
  "--cov=src/adh",            # Package coverage
  "--cov-report=xml:cov.xml", # Coverage report
]

[tool.ruff]
required-version = ">=0.15"
target-version = "py39"
[tool.ruff.format]
docstring-code-format = true
[tool.ruff.lint]
exclude = [
  "demos/*",
  "docs/*",
]
extend-select = [
  # "ANN", # flake8-annotations
  "S",   # flake8-bandit
  "B",   # flake8-bugbear
  "A",   # flake8-builtin
  "LOG", # flake8-logging
  # "PT",  # flake8-pytest-style
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "PTH", # flake8-use-pathlib
  "I",   # isort
  "N",   # pep8-naming
  "E",   # pycodestyle (E)
  "W",   # pycodestyle (W)
  # "DOC", # pydoclint [--preview]
  # "D",  # pydocstyle
  "F",  # Pyflakes
  "PL", # Pylint
  "UP", # pyupgrade
]
ignore = [
  "N815",    # mixedCase - temporarily ignore for refactor
  "E501",    # line length - temporarily ignore for refactor
  "F403",    # import star - temporarily ignore for refactor
  "PLR2004", # magic value - temporarily ignore for refactor
]
[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
  "S101", # asserts allowed in tests
  "ARG",  # Unused function args
  "FBT",  # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
  # The below are debateable
  "PLR2004", # Magic value used in comparison, ...
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]
[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true # Preserve types
[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  "pydantic.field_validator", # always used as a class method in ADH
]

[tool.ty.rules]
invalid-argument-type = "ignore"
[tool.ty.src]
include = [
  "src",
  # "tests",
]
