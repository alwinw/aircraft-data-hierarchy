[project]
name = "aircraft_data_hierarchy"
version = "0.2.0"
description = "The Aircraft Data Hierarchy (ADH) is a modern data definition standard for the aerospace vehicle design studies. The ADH enables engineers to exchange information (i.e. geometry, disciplinary tool inputs/outputs, requirements, etc.) between tools using a common data structure and a schema that can be validated."
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Ranald M Engelbeck" },
  { email = "ranald.m.engelbeck@boeing.com" },
  { name = "Eduardo Ocampo" },
]
requires-python = ">=3.8"
keywords = [
  "adh",
  "MBSA&E",
  "aerospace data exchange",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "graphviz>=0.20",  # for systems diagrams
  "tabulate>=0.9",   # for systems diagrams
  "ipython>=8.12.3", # for systems diagrams
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
  "autodocsumm>=0.2",
  "myst-nb>=0.17,<1; python_version < '3.9'",
  "myst-nb>=1.3; python_version >= '3.9'",
  "sphinx>=5.3.0; python_version < '3.9'",
  "sphinx>=7; python_version >= '3.9'",
  "sphinx-automodapi>=0.20",
  "sphinx-rtd-theme>=2; python_version < '3.9'",
  "sphinx-rtd-theme>=3; python_version >= '3.9'",
]
interactive = [
  "ipykernel>=6.29.0",
]
lint = [
  "pyright[nodejs]>=1.1.408",
  "ruff>=0.14",
  "ty>=0.0.14",
]
test = [
  "coverage>=7",
  "pytest>=8",
  "pytest-cov>=5; python_version < '3.9'",
  "pytest-cov>=7; python_version >= '3.9'",
]

[project.urls]
Repository = "https://github.com/Boeing/aircraft-data-hierarchy"
Documentation = "https://boeing.github.io/aircraft-data-hierarchy/"
Releases = "https://github.com/Boeing/aircraft-data-hierarchy/releases"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = false
changelog_incremental = true
use_shortcuts = true

[tool.pyright]
include = [
  "src",
  # "tests",
]
reportMissingImports = "none"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = [
  "-v",                                # Increase verbosity
  "-ra",                               # Extra test summary
  "--cov=src/aircraft_data_hierarchy", # Coverage
]

[tool.ruff]
required-version = ">=0.14"
target-version = "py38"
[tool.ruff.format]
docstring-code-format = true
[tool.ruff.lint]
extend-select = [
  "I",  # isort
  "UP", # pyupgrade
]
[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true # Preserve types

[tool.ty.rules]
invalid-argument-type = "ignore"
[tool.ty.src]
include = [
  "src",
  # "tests",
]
