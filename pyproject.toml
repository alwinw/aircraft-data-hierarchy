[build-system]
requires = [
    "setuptools>=45",
    "setuptools_scm[toml]>=6.2"
    ]
build-backend = 'setuptools.build_meta'

[tool.setuptools_scm]

[project]
name = "aircraft_data_hierarchy"
description = "Aircraft Data Hierarchy"
readme = "README.md"
authors = [
    {name = "Ranald M Engelbeck "},
    {email = "ranald.m.engelbeck@boeing.com"},
    {name = "Eduardo Ocampo"},
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Copyright :: The Boeing Company",
    "License :: Apache License Version 2.0",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=2.0",
    "graphviz",
    "tabulate",
    "IPython"
]

dynamic = ["version"]

# [tool.setuptools.dynamic]
# version = {attr = "designemypackagexplorer.__version__"}

[project.scripts]
adh-validate-json = "aircraft_data_hierarchy.validate_json:main"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov",
    "coverage",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-literate-nav >=0.6",
  "mkdocs-section-index >= 0.3",
  "mkdocstrings[python]>=0.28",
]

[tool.setuptools.packages.find]
where = ["./src"]
include = ["aircraft_data_hierarchy*"]

[tool.pytest.ini_options]
testpaths = "tests"
minversion = "6.0"
