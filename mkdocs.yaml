site_name: "ADH"
site_description: "Aircraft Data Hierarchy"
repo_url: "https://github.com/alwinw/aircraft-data-hierarchy"
repo_name: "alwinw/aircraft-data-hierarchy"
watch: [mkdocs.yaml, README.md, src/adh, docs]
copyright: Copyright &copy; 2024-2026 The Boeing Company.

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home:
      - Overview: index.md
      - License: license.md
  - API Reference: reference/

theme:
  name: material
  features:
    - announce.dismiss
    - navigation.expand

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - mkdocstrings:
      default_handler: python
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - admonition
  # - codehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
