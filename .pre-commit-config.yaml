# Adapted from:
# - https://github.com/BrianPugh/python-template/blob/main/.pre-commit-config.yaml
# - https://github.com/astral-sh/ruff/blob/main/.pre-commit-config.yaml

exclude: |
  (?x)^(
    .vscode/.*|
    target/.*|
    uv.lock
  )$

repos:
  # Priority 0: Read-only hooks; hooks that modify disjoint file types.
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        priority: 0
      - id: check-added-large-files
        args: [--maxkb=250]
        priority: 0
      - id: check-case-conflict
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-json
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-yaml
        priority: 0
      - id: end-of-file-fixer
        exclude: .*.json$
        priority: 1
      - id: mixed-line-ending
        files: \.(py|txt|yaml|yml|json|md|toml|lock|cfg|html|sh|js|rst)$
        priority: 1
      # - id: no-commit-to-branch
      #   args: [--branch, main]
      #   priority: 0
      - id: trailing-whitespace
        files: \.(py|txt|yaml|yml|md|toml|lock|cfg|html|sh|js|rst)$
        priority: 1

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        priority: 0

  - repo: https://github.com/crate-ci/typos
    rev: v1.42.0
    hooks:
      - id: typos
        priority: 0

  - repo: https://github.com/fredrikaverpil/creosote.git
    rev: v4.2.0
    hooks:
      - id: creosote
        priority: 0

  # Priority 1: Formatting (e.g. ruff-format before ruff-check)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-format
        priority: 1
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        require_serial: true
        priority: 2

  # Priority 2: Second-pass fixers (e.g., markdownlint-fix runs after mdformat).
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint-fix
        priority: 1
        exclude: CHANGELOG.md

  - repo: local
    hooks:
      - id: replace-em-dash
        name: Replace em dashes with hyphens
        entry: sed -i '' 's/—/-/g'
        language: system
        types: [file]
        exclude: .pre-commit-config.yaml
        priority: 2

      - id: gen-wbs-classes
        name: Check WBS classes are in sync with taxonomy
        language: python
        entry: python scripts/gen_wbs_classes.py --check
        additional_dependencies: ["pyyaml>=6.0"]
        files: ^src/adh/wbs/(air_vehicle\.py|payload\.py|ground_segment\.py|program_common\.py|__init__\.py)$
        pass_filenames: false
